<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
           
        .parent{
            padding: 43px;
            margin: 34px;
            border: 2px solid purple;
            /* now parent is fixed */
            position: absolute;
        }
        .box{
            border: 2px solid black;
            height: 433px;
            width: 80vw;
            margin: 3px;
            padding: 3px;

        }
        .box1{
            background-color:aqua ;
            position: sticky;
            top: 0px;
            height: 23px;
            width: 80vw;

            /* it will set 8 px to nearest position parent but in this there is no position element so aabove html it will be set */
            /* position: absolute;
            top:8px; */
            /* backside it will go */
            /* z-index: 1; */
        }
        .box2{
            background-color: blue;

            /* by making it relative i can change position in top bottom */
            /* position: relative; */
            /* top: 40px;
            left: 23px; */

        }
        .box3{
            background-color: black;
            position: fixed;
        }
        .box4{
            background-color: brown;

        }
     
    </style>
</head>
<body>
    <div class="parent">

    <div class="box box1" ></div>
    <div class="box box2" ></div>
    <div class="box box3" ></div>
    <div class="box box4" ></div>

    </div>
</body>
</html>

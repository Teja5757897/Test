<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box modeling</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
.box1{
    background-color: blue;
    padding: 10px;
    margin: 5px;
    border: 2px solid black;
    height: 200px;
    /* means the size of the box includes padding and border */
    box-sizing: border-box;
}
.box2{
    background-color: red;
    padding: 10px;
    /* margin collapse means which value is greather it will be applied to both in middle of the box */
    margin: 10px;
    border: 2px solid black;
    height: 200px;
    box-sizing: border-box;
}
    </style>
</head>

<body>
    <h3 class="box box1">
        box1
    </h3>
    <h3 class="box box2">
        box2
    </h3>
</body>

</html>

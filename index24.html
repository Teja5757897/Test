<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling lists in css</title>
    <style>
        nav ul li{

            /* number style */
            list-style: devanagari;
            background-color: yellow;
            list-style-type: "🐱";
            border: 2px solid black;


            /* the number outside is called markres and when i apply backgroud colour it wont get color so by using below we make markrs to get color */
            list-style-position: inside;
            /* list-style-image: url(); */

        }
    </style>
</head>
<body>
    <nav>
    <ul>
        <li>Home</li>
        <li>about</li>
        <li>contact</li>
    </ul>
    </nav>
</body>
</html>
